name: Build Model from Upstream
env:
  BUILD_DIR: /data/openpilot
  OUTPUT_DIR: ${{ github.workspace }}/output
  SCONS_CACHE_DIR: ${{ github.workspace }}/release/ci/scons_cache
  UPSTREAM_REPO: commaai/openpilot
  TINYGRAD_PATH: ${{ github.workspace }}/tinygrad_repo
  MODELS_DIR: ${{ github.workspace }}/selfdrive/modeld/models
'on':
  workflow_dispatch:
    inputs:
      upstream_branch:
        description: Upstream branch to build from
        required: true
        default: master
        type: string
      custom_name:
        description: Custom name for the model (no date, only name)
        required: false
        type: string
      is_20hz:
        description: Is this a 20Hz model
        required: false
        type: boolean
        default: true
run-name: Build model [${{ inputs.custom_name || inputs.upstream_branch }}] from ref
  [${{ inputs.upstream_branch }}]
jobs:
  get_model:
    runs-on: ubuntu-latest
    outputs:
      model_date: ${{ steps.commit-date.outputs.model_date }}
    steps:
    - uses: actions/checkout@v4
      with:
        repository: ${{ env.UPSTREAM_REPO }}
        ref: ${{ github.event.inputs.upstream_branch }}
        submodules: recursive
    - name: Get commit date
      id: commit-date
      run: '# Get the commit date in YYYY-MM-DD format

        commit_date=$(git log -1 --format=%cd --date=format:''%B %d, %Y'')

        echo "model_date=${commit_date}" >> $GITHUB_OUTPUT

        cat $GITHUB_OUTPUT

        '
    - run: git lfs pull
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: models
        path: ${{ github.workspace }}/selfdrive/modeld/models/*.onnx
  build_model:
    runs-on: ubuntu-latest
    needs: get_model
    env:
      MODEL_NAME: ${{ inputs.custom_name || inputs.upstream_branch }} (${{ needs.get_model.outputs.model_date
        }})
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - run: git lfs pull
    - name: Cache SCons
      uses: actions/cache@v4
      with:
        path: ${{env.SCONS_CACHE_DIR}}
        key: scons-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name
          }}-model-${{ github.sha }}
        restore-keys: 'scons-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref
          || github.ref_name }}-model

          scons-${{ runner.os }}-${{ runner.arch }}-${{ github.head_ref || github.ref_name
          }}

          scons-${{ runner.os }}-${{ runner.arch }}-${{ env.MASTER_NEW_BRANCH }}-model

          scons-${{ runner.os }}-${{ runner.arch }}-${{ env.MASTER_BRANCH }}-model

          scons-${{ runner.os }}-${{ runner.arch }}-${{ env.MASTER_NEW_BRANCH }}

          scons-${{ runner.os }}-${{ runner.arch }}-${{ env.MASTER_BRANCH }}

          scons-${{ runner.os }}-${{ runner.arch }}

          '
    - name: Set environment variables
      id: set-env
      run: "# Set up common environment\nsource /etc/profile;\nexport UV_PROJECT_ENVIRONMENT=${HOME}/venv\n\
        export VIRTUAL_ENV=$UV_PROJECT_ENVIRONMENT\nprintenv >> $GITHUB_ENV\nif [[\
        \ \"${{ runner.debug }}\" == \"1\" ]]; then\n  cat $GITHUB_OUTPUT\nfi\n"
    - name: Setup build environment
      run: "mkdir -p \"${BUILD_DIR}/\"\nsudo find $BUILD_DIR/ -mindepth 1 -delete\n\
        echo \"Starting build stage...\"\necho \"BUILD_DIR: ${BUILD_DIR}\"\necho \"\
        CI_DIR: ${CI_DIR}\"\necho \"VERSION: ${{ steps.set-env.outputs.version }}\"\
        \necho \"UV_PROJECT_ENVIRONMENT: ${UV_PROJECT_ENVIRONMENT}\"\necho \"VIRTUAL_ENV:\
        \ ${VIRTUAL_ENV}\"\necho \"-------\"\nif [[ \"${{ runner.debug }}\" == \"\
        1\" ]]; then\n  printenv\nfi\nPYTHONPATH=$PYTHONPATH:${{ github.workspace\
        \ }}/ ${{ github.workspace }}/scripts/manage-powersave.py --disable\nrm -rf\
        \ ${{ env.MODELS_DIR }}/*.onnx\n"
    - name: Download model artifacts
      uses: actions/download-artifact@v4
      with:
        name: models
        path: ${{ github.workspace }}/selfdrive/modeld/models
    - name: Build Model
      run: "source /etc/profile\nexport UV_PROJECT_ENVIRONMENT=${HOME}/venv\nexport\
        \ VIRTUAL_ENV=$UV_PROJECT_ENVIRONMENT\nexport PYTHONPATH=\"${PYTHONPATH}:${{\
        \ env.TINYGRAD_PATH }}\"\n\n# Loop through all .onnx files\nfind \"${{ env.MODELS_DIR\
        \ }}\" -maxdepth 1 -name '*.onnx' | while IFS= read -r onnx_file; do\n  base_name=$(basename\
        \ \"$onnx_file\" .onnx)\n  output_file=\"${{ env.MODELS_DIR }}/${base_name}_tinygrad.pkl\"\
        \n\n  echo \"Compiling: $onnx_file -> $output_file\"\n  QCOM=1 python3 \"\
        ${{ env.TINYGRAD_PATH }}/examples/openpilot/compile3.py\" \"$onnx_file\" \"\
        $output_file\"\n  QCOM=1 python3 \"${{ env.MODELS_DIR }}/../get_model_metadata.py\"\
        \ \"$onnx_file\" || true\ndone\n"
    - name: Prepare Output
      run: "sudo rm -rf ${{ env.OUTPUT_DIR }}\nmkdir -p ${{ env.OUTPUT_DIR }}\n\n\
        # Copy the model files\nrsync -avm \\\n  --include='*.dlc' \\\n  --include='*.thneed'\
        \ \\\n  --include='*.pkl' \\\n  --include='*.onnx' \\\n  --exclude='*' \\\n\
        \  --delete-excluded \\\n  --chown=comma:comma \\\n  ${{ env.MODELS_DIR }}/\
        \ ${{ env.OUTPUT_DIR }}/\n\npython3 \"${{ github.workspace }}/release/ci/model_generator.py\"\
        \ \\\n  --model-dir \"${{ env.MODELS_DIR }}\" \\\n  --output-dir \"${{ env.OUTPUT_DIR\
        \ }}\" \\\n  --custom-name \"${{ env.MODEL_NAME }}\" \\\n  --upstream-branch\
        \ \"${{ inputs.upstream_branch }}\" \\\n  ${{ inputs.is_20hz && '--is-20hz'\
        \ || '' }}\n"
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: model-${{ env.MODEL_NAME }}-${{ github.run_number }}
        path: ${{ env.OUTPUT_DIR }}
    - name: Re-enable powersave
      if: always()
      run: 'PYTHONPATH=$PYTHONPATH:${{ github.workspace }}/ ${{ github.workspace }}/scripts/manage-powersave.py
        --enable

        '
